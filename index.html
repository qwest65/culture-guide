<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Культурный маршрут</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><div><div class="brand">Культурный маршрут</div><div class="subtitle">Памятники и культурные места · схема маршрутов как у метро</div></div><div class="actions"><button id="exportBtn">Экспорт JSON</button><label class="file-btn">Импорт JSON<input id="importFile" type="file" accept=".json"></label></div></header>
<main class="layout"><aside class="sidebar"><section><label>Город</label><select id="citySelect"></select></section><section><input id="search" placeholder="Поиск места…"></section><section class="stats" id="stats"></section><section><h3>Категории</h3><div id="filters" class="filters"></div></section><section><h3>Места</h3><div id="places" class="places"></div></section>
<section><h3>Добавить город</h3><input id="newCityName" placeholder="Название города"><input id="newCountry" placeholder="Страна"><input id="newLat" type="number" step="any" placeholder="Широта"><input id="newLon" type="number" step="any" placeholder="Долгота"><button id="addCityBtn" class="primary">Добавить город</button></section>
<section><h3>Добавить объект</h3><input id="placeName" placeholder="Название"><select id="placeCategory"><option value="monument">Памятник</option><option value="museum">Музей</option><option value="architecture">Архитектура</option><option value="religion">Храм</option><option value="nature">Природа</option><option value="culture">Культура</option><option value="other">Другое</option></select><textarea id="placeDescription" placeholder="Описание"></textarea><input id="placeLat" type="number" step="any" placeholder="Широта"><input id="placeLon" type="number" step="any" placeholder="Долгота"><button id="addPlaceBtn" class="primary">Добавить объект</button></section></aside>
<section class="content"><div class="map-wrap"><div id="map"></div><div class="map-title" id="mapTitle"></div></div><div class="scheme-wrap"><div class="scheme-header"><div><h2>Схема культурного маршрута</h2><span>Ветки строятся автоматически по графу объектов</span></div><button id="rebuildBtn">Перестроить схему</button></div><div id="scheme"></div></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
