name: Android APK

on:
  push:
    branches: ["dev", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Check MapKit API key
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: |
          if [ -z "$MAPKIT_API_KEY" ]; then
            echo "::error::GitHub Actions secret MAPKIT_API_KEY is not configured."
            exit 1
          fi

      - name: Unit tests and debug APK
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION_NAME ($VERSION_CODE), commit ${GITHUB_SHA::7}"
          KIDS_NAME=$(grep 'versionName' app-kids/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          KIDS_CODE=$(grep 'versionCode' app-kids/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "kids_name=$KIDS_NAME" >> "$GITHUB_OUTPUT"
          echo "kids_code=$KIDS_CODE" >> "$GITHUB_OUTPUT"
          echo "Kids APK version: $KIDS_NAME ($KIDS_CODE)"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CultureGuide.apk
          (cd dist && sha256sum CultureGuide.apk > SHA256SUMS.txt)
          mkdir -p dist-kids dist-preview
          cp app-kids/build/outputs/apk/debug/app-kids-debug.apk dist-kids/MalenkiyKaravan.apk
          (cd dist-kids && sha256sum MalenkiyKaravan.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt dist-kids/SHA256SUMS.txt > dist-preview/SHA256SUMS.txt
          ls -lh dist dist-kids

      - uses: actions/upload-artifact@v4
        with:
          name: CultureGuide-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.sha }}
          path: dist/CultureGuide.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MalenkiyKaravan-v${{ steps.version.outputs.kids_name }}-${{ steps.version.outputs.sha }}
          path: dist-kids/MalenkiyKaravan.apk
          if-no-files-found: error

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          SHA: ${{ steps.version.outputs.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          ## Культурный гид ${VERSION}

          Сборка \`${VERSION}\` (versionCode ${CODE}) из ветки \`${BRANCH}\`, коммит [\`${SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          ### Как установить на телефон

          1. Скачайте **CultureGuide.apk** (версия ${VERSION}) из списка файлов ниже (Assets).
          2. Откройте файл на телефоне и разрешите установку из этого источника, если Android попросит.
          3. При первом запуске разрешите доступ к геолокации — он нужен для режима ведения.

          Требуется Android 8.0 или новее. Обновления ставятся поверх предыдущей версии; если телефон
          сообщает о конфликте подписи, один раз удалите старую сборку (выпущенную до 0.9.0).

          Контрольные суммы — в файле \`SHA256SUMS.txt\`.
          NOTES

      - name: Write kids release notes
        env:
          VERSION: ${{ steps.version.outputs.kids_name }}
          CODE: ${{ steps.version.outputs.kids_code }}
          SHA: ${{ steps.version.outputs.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cat > notes-kids.md <<NOTES
          ## Маленький караван ${VERSION}

          Прогулка для детей 4–7 лет с родителями: верблюжонок Троша потерял вещи в Троицке.
          Сборка \`${VERSION}\` (versionCode ${CODE}) из ветки \`${BRANCH}\`, коммит [\`${SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          ### Как установить на телефон

          1. Скачайте **MalenkiyKaravan.apk** (версия ${VERSION}) из списка файлов ниже (Assets).
          2. Откройте файл на телефоне и разрешите установку из этого источника, если Android попросит.
          3. Перед прогулкой разрешите доступ к геолокации — так Троша узнает, что вы дошли до точки.

          Требуется Android 8.0 или новее. Контрольные суммы — в файле \`SHA256SUMS.txt\`.
          NOTES
          { cat notes.md; echo; echo '---'; echo; cat notes-kids.md; } > notes-preview.md

      - name: Publish release
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          TAG="v${VERSION}"
          # Старый «плавающий» релиз latest заменён версионными релизами.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          # Та же версия, собранная из более нового коммита: тег переезжает на новый коммит.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            dist/CultureGuide.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Культурный гид ${VERSION}" \
            --notes-file notes.md \
            --latest

      - name: Publish kids release
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.kids_name }}
        run: |
          # Постоянный тег karavan: ссылка на MalenkiyKaravan.apk не меняется от версии к версии.
          gh release delete karavan --yes --cleanup-tag 2>/dev/null || true
          gh release create karavan \
            dist-kids/MalenkiyKaravan.apk dist-kids/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Маленький караван ${VERSION}" \
            --notes-file notes-kids.md \
            --latest=false

      - name: Publish preview pre-release
        if: github.ref != 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          gh release create preview \
            dist/CultureGuide.apk dist-kids/MalenkiyKaravan.apk dist-preview/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Предварительная сборка ${VERSION} (${GITHUB_REF_NAME})" \
            --notes-file notes-preview.md \
            --prerelease \
            --latest=false
