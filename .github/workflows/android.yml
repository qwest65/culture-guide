name: Android APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer==1.6.0 cython==0.29.34

      - name: Clean Android build state
        run: |
          rm -rf .buildozer bin
          rm -rf ~/.buildozer/android/platform/python-for-android
          rm -rf ~/.buildozer/android/platform/build-*

      - name: Build APK
        run: buildozer android debug

      - name: Verify APK
        run: |
          ls -lh bin/*.apk
          file bin/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: culture-guide-apk
          path: bin/*.apk
          if-no-files-found: error
