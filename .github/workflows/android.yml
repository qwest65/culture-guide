name: Android APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check MapKit API key
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: |
          if [ -z "$MAPKIT_API_KEY" ]; then
            echo "::error::GitHub Actions secret MAPKIT_API_KEY is not configured."
            exit 1
          fi
      - name: Build debug APK
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: gradle assembleDebug --stacktrace
      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION_NAME ($VERSION_CODE), commit $SHORT_SHA"
      - name: Prepare versioned APK
        run: |
          cp app/build/outputs/apk/debug/*.apk "CultureGuide-v${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.short_sha }}.apk"
          cp app/build/outputs/apk/debug/*.apk CultureGuide.apk
          ls -lh CultureGuide*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CultureGuide-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.short_sha }}
          path: |
            CultureGuide.apk
            CultureGuide-v*.apk
          if-no-files-found: error
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest CultureGuide.apk --clobber
          else
            gh release create latest CultureGuide.apk               --title "CultureGuide — latest"               --notes "Последняя успешная Android-сборка CultureGuide."
          fi
